# BWCE Build Properties
# Harbor Container Registry
HARBOR_REGISTRY=harbor.adidas.com
HARBOR_PROJECT=core-integration
HARBOR_IMAGE_PREFIX=bwce-

# BWCE Runtime Configuration
BWCE_RUNTIME_VERSION=2.9.0
BWCE_BASE_IMAGE=tibco/bwce:2.9.0

# Jenkins Configuration
JENKINS_WORKSPACE=/var/jenkins_home/workspace
JENKINS_AGENT_LABEL=bwce-agent
JENKINS_CREDENTIALS_ID=harbor-credentials

# Kubernetes Configuration
K8S_NAMESPACE_DEV=integration-dev
K8S_NAMESPACE_SIT=integration-sit
K8S_NAMESPACE_UAT=integration-uat
K8S_NAMESPACE_PROD=integration-prod
K8S_RESOURCE_CPU_REQUEST=250m
K8S_RESOURCE_CPU_LIMIT=1000m
K8S_RESOURCE_MEM_REQUEST=256Mi
K8S_RESOURCE_MEM_LIMIT=512Mi

# Bitbucket Configuration
BITBUCKET_BASE_URL=https://bitbucket.adidas.com
BITBUCKET_DEFAULT_BRANCH=main
BITBUCKET_RELEASE_BRANCH=release/1.0.0

# Generation Defaults
DEFAULT_ENV=DEV
DEFAULT_BW_PROFILE=default
DEFAULT_K8S_DOMAIN=cite
DEFAULT_SCENARIO_ID=1234
MAX_REPO_NAME_LENGTH=50
